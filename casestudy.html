    <script>

    const carousel = document.getElementById('appCarousel');
    function autoPlay() {
        const slideWidth = carousel.querySelector('.slide').offsetWidth + 12; // width + gap
        const maxScroll = carousel.scrollWidth - carousel.offsetWidth;
        if (carousel.scrollLeft >= maxScroll - 5) {
            carousel.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
            carousel.scrollBy({ left: slideWidth, behavior: 'smooth' });
        }
    }
    let play = setInterval(autoPlay, 5000);
    carousel.addEventListener('pointerdown', () => clearInterval(play));
    carousel.addEventListener('pointerup', () => {
        play = setInterval(autoPlay, 5000);
    });

    function selectOption(element) {
    const options = document.querySelectorAll('.gender-options');
    options.forEach(opt => opt.classList.remove('active'));
    element.classList.add('active');
    }

    // Select all wishlist icons
const wishlistIcons = document.querySelectorAll('.wishlist-icon');

wishlistIcons.forEach(icon => {
    icon.addEventListener('click', function() {
        // Toggle the 'active' class on click
        this.classList.toggle('active');
        
        // Optional: Swap between regular and solid heart icons
        const heartIcon = this.querySelector('i');
        if (this.classList.contains('active')) {
            heartIcon.classList.replace('fa-regular', 'fa-solid');
        } else {
            heartIcon.classList.replace('fa-solid', 'fa-regular');
        }
    });
});
